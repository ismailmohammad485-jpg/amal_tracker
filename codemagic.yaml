workflows:
  android-workflow:
    name: Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Regenerate Android platform project (matches installed Flutter version)
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.amaltracker
      - name: Get packages
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
